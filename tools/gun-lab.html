<script type="module">

import * as THREE from "three";
import { Weapons } from "../js/core/guns.js";

import { horizontalToVertical } from "../js/core/fov.js";
const out = {}; const log = []; window.__res = out;

  fake.aiming = false; fake._adsZoom = 0; const t3 = []; for (let i = 0; i < 120; i++) { TP._updateAimFov.call(fake, 1 / 60, true); t3.push(fake.camera.fov); }

window.__done = true;
