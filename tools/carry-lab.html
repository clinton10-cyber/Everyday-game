<!doctype html><meta charset="utf-8"><title>Carry lab</title>
<script async src="../vendor/es-module-shims.js"></script>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.min.js","three/addons/":"../vendor/three/addons/"}}</script>
<style>html,body{margin:0;background:#9aa4b2}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module">
/* tools/carry-lab.html -- renders every carryable object held by the real avatar rig, front and side,

   Open  tools/carry-lab.html?types=bat,bag  (default: all). window.__done is set when finished. */
import * as THREE from "three";

const ALL = ["food","junkfood","water","money","phone","bag","bat","bottle","book","cigarettes","dumbbell","crate","spray_can"];

R.setPixelRatio(1); R.setSize(cv.width, cv.height, false); R.setScissorTest(true); R.setClearColor(0x9aa4b2);

];

  { const bb = new THREE.Box3().setFromObject(m); (window.__bb = window.__bb || {})[t] = { min: bb.min.toArray().map(n => +n.toFixed(2)), max: bb.max.toArray().map(n => +n.toFixed(2)) }; }

  for (let k = 0; k < 60; k++) { built.root.updateMatrixWorld(true); PlayerActions.tick(walker, 0.05, null); }

  if (t === "crate") { const w = (o) => { const v = new THREE.Vector3(); o && o.getWorldPosition(v); return v.toArray().map(n => +n.toFixed(2)); }; const r = built.rig;
    window.__crateDbg = { spine: w(r.spine), hips: w(r.hips), head: w(r.head), shL: w(r.armL.shoulder), shR: w(r.armR.shoulder), elL: w(r.armL.elbow), gripL: w(r.armL.grip || r.armL.wrist), crate: w(m) }; }

    const cam = new THREE.PerspectiveCamera(38, 1, 0.05, 20); cam.position.set(...v.pos); cam.lookAt(...v.look);

  });

types.forEach((t, i) => views.forEach((v, j) => { const cell = i * 2 + j; const d = document.createElement("div"); d.textContent = t + " / " + v.name; d.style.cssText = `position:fixed;left:${(cell % COLS) * CW + 4}px;top:${Math.floor(cell / COLS) * CW + 4}px;font:12px monospace;color:#ff0;background:#0008;padding:1px 4px`; document.body.appendChild(d); }));

</script>
