<!doctype html><html><head><meta charset="utf-8"><title>Stage debug</title>
<style>html,body{margin:0;background:#000}canvas{width:100vw;height:100vh;display:block}</style>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.min.js","three/addons/":"../vendor/three/addons/"}}</script>
</head><body><canvas id="c"></canvas>
<script type="module">
/* Developer tool: renders a story location from any camera so stage anchors and shots can be tuned.
   Usage from the console / automation: await dbg.load('hotel'); dbg.view([x,y,z],[x,y,z],fov); dbg.top(cx,cz,halfSize) */
import * as THREE from '../vendor/three/three.module.min.js';
import { buildSet, STAGES } from '../js/cinematics/story-player.js';
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
const rig=new THREE.Group();rig.add(new THREE.HemisphereLight('#eaf5ff','#4a493c',1.65));
const sun=new THREE.DirectionalLight('#fff0d1',2.35);sun.position.set(-180,260,160);rig.add(sun);scene.add(rig);
let cur=null;
window.dbg={
  STAGES,
  async load(key){ if(cur){scene.remove(cur.group);} cur=await buildSet(key); scene.add(cur.group); rig.visible=!cur.interior; scene.background=cur.background||new THREE.Color('#9dc4e8'); scene.fog=cur.fog||null; return {interior:cur.interior}; },
  view(p,t,fov=60){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); const cam=new THREE.PerspectiveCamera(fov,w/h,.1,2000); cam.position.set(...p); cam.lookAt(new THREE.Vector3(...t)); renderer.render(scene,cam); },
  top(cx,cz,half=30){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); const a=w/h; const cam=new THREE.OrthographicCamera(-half*a,half*a,half,-half,.1,2000); cam.position.set(cx,500,cz); cam.up.set(0,0,-1); cam.lookAt(cx,0,cz); const old=scene.fog; scene.fog=null; renderer.render(scene,cam); scene.fog=old; },
  bounds(){ const b=new THREE.Box3().setFromObject(cur.group); return {min:b.min.toArray().map(n=>+n.toFixed(1)),max:b.max.toArray().map(n=>+n.toFixed(1))}; },
  roads(){ const wd=cur.group.userData.worldData; return wd?wd.roads:null; },
  landmarks(){ const wd=cur.group.userData.worldData; return wd?wd.landmarks:null; }
};
window.dbgReady=true;
</script></body></html>
