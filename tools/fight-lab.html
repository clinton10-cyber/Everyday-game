<!doctype html><meta charset="utf-8"><title>Fight lab</title>
<script async src="../vendor/es-module-shims.js"></script>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.min.js","three/addons/":"../vendor/three/addons/"}}</script>
<style>html,body{margin:0;background:#8f98a6}canvas{display:block}div.l{position:fixed;font:11px monospace;color:#fff;background:#0008;padding:1px 3px}</style>
<canvas id="c"></canvas>
<script type="module">
/* tools/fight-lab.html -- plays every fight move on two real avatar rigs with the game's own animator
   (attacker emote + victim vic_ emote, carry path, limp physics) and renders a contact sheet:
   one row per move, columns = moments in the move, side view.
   ?moves=jab,cross (default all)  ?cols=8   window.__contact = limb-to-target distance at impact. window.__done when finished. */
import * as THREE from "three";
import { buildCharacter } from "../js/characters/lowpoly.js";
import { animate, EMOTES } from "../js/characters/animator.js";
import { WRESTLING_MOVES, EMOTE_SPEED } from "../js/characters/wrestling.js";
import { Limp } from "../js/characters/limp.js";
const q = new URLSearchParams(location.search);
const names = q.get("moves") ? q.get("moves").split(",") : Object.keys(WRESTLING_MOVES).filter(n => !WRESTLING_MOVES[n].hidden);
const COLS = +(q.get("cols") || 8), CW = +(q.get("cw") || 250), rows = names.length;
const cv = document.getElementById("c"); cv.width = CW * COLS; cv.height = CW * rows;
const R = new THREE.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true });
R.setPixelRatio(1); R.setSize(cv.width, cv.height, false); R.setScissorTest(true); R.setClearColor(0x8f98a6);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x667788, 1.6));
const dl = new THREE.DirectionalLight(0xffffff, 1.4); dl.position.set(-3, 5, 2); scene.add(dl);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.MeshLambertMaterial({ color: 0x6f7a66 })); floor.rotation.x = -Math.PI / 2; scene.add(floor);
const grid = new THREE.GridHelper(12, 24, 0x445, 0x556); grid.position.y = 0.002; scene.add(grid);
const A = buildCharacter(null), V = buildCharacter({ shirt: 0xb04040 }); scene.add(A.root, V.root);
const LIMBS = new Set(["shL","shR","hpL","hpR","elL","elR","knL","knR","hd","wrL","wrR","anL","anR"]);
const sstep = t => { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); };
const mkCtl = (b) => ({ rig: b.rig, pos: { x: 0, z: 0 }, yaw: 0, state: "standing", vel: { x: 0, y: 0, z: 0 }, onGround: true, _guard: true });
const ca = mkCtl(A), cvic = mkCtl(V);
const place = (c, b) => { b.root.position.set(c.pos.x, 0, c.pos.z); b.root.rotation.y = c.yaw; };
const wp = o => { const v = new THREE.Vector3(); o && o.getWorldPosition(v); return v; };
const STRIKER = { jab: ["armL", "wrist"], cross: ["armR", "wrist"], hook: ["armR", "wrist"], elbowStrike: ["armR", "elbow"], lowKick: ["legR", "ankle"], roundhouse: ["legR", "ankle"], superkick: ["legR", "ankle"], clothesline: ["armR", "wrist"], clinchKnee: ["legR", "knee"] };
const TARGET = { head: r => r.head, torso: r => r.spine, leg: r => r.legL.knee };
function carryPos(m, t, sx, sz) {
  const p = m.path; if (!p || !p.length) return null;
  let f, s, u = 1;
  if (t < p[0][0]) { f = p[0][1]; s = p[0][2]; u = sstep(t / Math.max(p[0][0], 1e-3)); }
  else { let i = 1; while (i < p.length && t > p[i][0]) i++;
    if (i >= p.length) { f = p[p.length - 1][1]; s = p[p.length - 1][2]; }
    else { const a = p[i - 1], b = p[i], k = sstep((t - a[0]) / Math.max(b[0] - a[0], 1e-4)); f = a[1] + (b[1] - a[1]) * k; s = a[2] + (b[2] - a[2]) * k; } }
  const tx = f, tz = 0, lx = 1, lz = 0;   // attacker at origin facing +z: forward = +z, left = +x
  const X = s, Z = f;
  return t < p[0][0] ? { x: sx + (X - sx) * u, z: 0 + 0, zz: sz + (Z - sz) * u } : { x: X, zz: Z };
}
window.__contact = {};
/* ---- simulation of one move on the two rigs (shared by the sheet and the video modes) ---- */
const Sim = {
  init(name) {
    const m = WRESTLING_MOVES[name], needsC = m.needs === "clinch" || m.kind === "clinchStrike";
    const held = m.kind === "heavy" || m.kind === "grab" || needsC;
    const gapQ = q.get("gap") ? +q.get("gap") : null;
    const start = needsC ? 0.58 : (gapQ != null && !held ? gapQ : (m.kind === "heavy" ? Math.min(1.2, m.reach * 0.62) : Math.min(1.1, m.reach * 0.55)));
    for (const [c, b] of [[ca, A], [cvic, V]]) { c._anim = null; c._emoteName = null; c._emoteTimer = 0; c._overlay = null; try { Limp.release(b.rig); } catch (e) {} }
    ca.pos.x = 0; ca.pos.z = 0; ca.yaw = 0; cvic.pos.x = 0; cvic.pos.z = start; cvic.yaw = Math.PI; cvic._guard = false;
    for (let i = 0; i < 20; i++) { animate(ca, 1 / 60); animate(cvic, 1 / 60); }
    const em = EMOTES[name];
    Object.assign(this, { name, m, held, start, em, vem: EMOTES["vic_" + name], vStarted: false, tNow: 0, t: 0, done: false });
    ca._emoteName = name; ca._emotePhase = 0; ca._emoteTimer = em.dur;
    this.endT = m.knock ? m.fin : Math.min(0.97, m.cancel + 0.12);
  },
  tick(dt) {
    const { m, held, em, vem, name, start } = this;
    const t = (ca._emotePhase || 0) / em.dur; this.t = t;
    ca._anim && (ca._anim.wrDist = Math.hypot(cvic.pos.x - ca.pos.x, cvic.pos.z - ca.pos.z));
    if (vem) {
      if (held && !this.vStarted) { cvic._emoteName = "vic_" + name; cvic._emotePhase = 0; cvic._emoteTimer = vem.dur; this.vStarted = true;
        if (m.kind === "heavy") cvic._overlay = (Rg) => { const w = sstep((this.tNow - 0.22) / 0.18) * 0.62; try { Limp.step(Rg, Rg.hips, dt, { mask: LIMBS, w }); } catch (e) {} }; }
      if (!held && !this.vStarted && t >= m.impact) { cvic._emoteName = "vic_" + name; cvic._emotePhase = vem.dur * m.impact; cvic._emoteTimer = vem.dur * (1 - m.impact); this.vStarted = true; this.push = m.push || 0; this.pushT0 = t; }
    }
    if (held) { const cp = carryPos(m, Math.min(t, 1), 0, start); if (cp) { cvic.pos.x = cp.x; cvic.pos.z = cp.zz; cvic.yaw = Math.atan2(ca.pos.x - cvic.pos.x, ca.pos.z - cvic.pos.z); } }
    else if (this.push && this.vStarted) cvic.pos.z = start + this.push * sstep((t - this.pushT0) / 0.12);
    animate(ca, dt); animate(cvic, dt);
    place(ca, A); place(cvic, V); A.root.updateMatrixWorld(true); V.root.updateMatrixWorld(true);
    this.tNow = t;
    if (ca._emotePhase > em.dur + 0.2 || (ca._emoteTimer <= 0)) this.done = true;
  },
};
const makeCam = (start) => { const cam = new THREE.PerspectiveCamera(36, 1, 0.05, 30); cam.position.set(-5.0, 1.05, Math.min(1.0, start * 0.5 + 0.2)); cam.lookAt(0, 0.88, cam.position.z); return cam; };
const measure = (name, m) => {
  if (!STRIKER[name]) return;
  const [limbN, jn] = STRIKER[name]; const j = ca.rig[limbN] && ca.rig[limbN][jn === "ankle" ? (ca.rig[limbN].ankle ? "ankle" : "ank") : jn];
  const tg = TARGET[m.part] ? TARGET[m.part](V.rig) : V.rig.head;
  if (j && tg) { const a = wp(j), b = wp(tg); window.__contact[name] = { dist: +a.distanceTo(b).toFixed(2), dy: +(a.y - b.y).toFixed(2), dz: +(a.z - b.z).toFixed(2), dx: +(a.x - b.x).toFixed(2), reachGap: +(Math.hypot(cvic.pos.x - ca.pos.x, cvic.pos.z - ca.pos.z)).toFixed(2), part: m.part }; }
};

if (q.get("video")) {
  /* video mode: a single big view, stepped by the caller (Playwright) one frame at a time */
  const W = +(q.get("w") || 560), Hh = +(q.get("h") || 420);
  cv.width = W; cv.height = Hh; R.setScissorTest(false); R.setSize(W, Hh, false); R.setViewport(0, 0, W, Hh);
  const cam = new THREE.PerspectiveCamera(34, W / Hh, 0.05, 30);
  const lbl = document.createElement("div"); lbl.className = "l"; lbl.style.cssText = "left:4px;top:4px;font-size:15px"; document.body.appendChild(lbl);
  const tl = document.createElement("div"); tl.className = "l"; tl.style.cssText = "left:4px;bottom:4px"; tl.id = "tl"; document.body.appendChild(tl);
  window.__fl = {
    names, begin(name) { Sim.init(name); lbl.textContent = Sim.m.label + "  [" + Sim.m.kind + "]"; this.view = 0; },
    step() { for (let i = 0; i < 4 && !Sim.done; i++) Sim.tick(1 / 240); return !Sim.done && Sim.t < Sim.endT + 0.06; },
    draw(view) {
      const z = Math.min(1.0, Sim.start * 0.5 + 0.2);
      if (view === "front") { cam.position.set(2.6, 1.5, z + 3.2); cam.lookAt(0, 0.85, z); } else { cam.position.set(-4.6, 1.15, z); cam.lookAt(0, 0.9, z); }
      R.render(scene, cam); tl.textContent = "t=" + Sim.t.toFixed(2) + (Math.abs(Sim.t - Sim.m.impact) < 0.04 ? "  IMPACT" : "");
    },
  };
  window.__done = true;
} else {
  names.forEach((name, row) => {
    Sim.init(name); const m = Sim.m;
    const endT = Sim.endT, times = []; for (let i = 0; i < COLS; i++) times.push(0.02 + (endT - 0.02) * i / (COLS - 1));
    let bi = 0; times.forEach((t, i) => { if (Math.abs(t - m.impact) < Math.abs(times[bi] - m.impact)) bi = i; }); times[bi] = m.impact;
    const cam = makeCam(Sim.start);
    const lbl = document.createElement("div"); lbl.className = "l"; lbl.textContent = name + "  (" + m.kind + ", impact " + m.impact + ")"; lbl.style.cssText = `left:2px;top:${row * CW + 2}px`; document.body.appendChild(lbl);
    let cell = 0;
    while (cell < COLS && !Sim.done) {
      Sim.tick(1 / 240);
      if (Sim.t >= times[cell] - 1e-4) {
        const cx = cell * CW, cy = (rows - 1 - row) * CW;
        R.setViewport(cx, cy, CW, CW); R.setScissor(cx, cy, CW, CW); R.render(scene, cam);
        const tl = document.createElement("div"); tl.className = "l"; tl.textContent = Sim.t.toFixed(2) + (cell === bi ? " IMPACT" : ""); tl.style.cssText = `left:${cx + 2}px;top:${row * CW + CW - 16}px`; document.body.appendChild(tl);
        if (cell === bi) measure(name, m);
        cell++;
      }
    }
  });
  window.__done = true;
}
</script>
