<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Everyday Voice-Over Recorder</title>
<style>
:root{--bg:#0f1218;--card:#181d27;--line:#2a3142;--tx:#eef1f6;--mut:#8b94a7;--ac:#4fa3ff;--ok:#3ecf8e;--rec:#ff4d5e;--warn:#f5b73b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:#0f1218ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 14px}
h1{font-size:18px;margin:0 0 6px}.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.tabs{display:flex;gap:6px;overflow:auto;padding:10px 14px}.tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:20px;cursor:pointer;font-size:14px}.tab.on{background:var(--ac);border-color:var(--ac);color:#04121f;font-weight:600}
main{padding:0 14px 90px;max-width:760px;margin:auto}h2{font-size:15px;color:var(--mut);margin:22px 0 8px;text-transform:uppercase;letter-spacing:.06em}
.line{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}.line.done{border-color:var(--ok)}.line.live{border-color:var(--rec)}
.who{font-weight:700;color:var(--ac)}.meta{color:var(--mut);font-size:13px}.txt{font-size:22px;line-height:1.35;margin:8px 0 10px}.note{color:var(--warn);font-size:14px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:#2a3142;color:var(--tx)}button.rec{background:var(--rec);color:#fff;font-weight:700}button.go{background:var(--ok);color:#04170e;font-weight:700}button:disabled{opacity:.4}
.st{font-size:13px;margin-left:4px}.long{color:var(--warn)}.ok{color:var(--ok)}
textarea{width:100%;background:#0f1218;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;margin-top:6px}
.foot{position:fixed;left:0;right:0;bottom:0;background:#0f1218f2;border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
small{color:var(--mut)}
</style></head><body>
<header><h1>🎙️ Everyday – Voice-Over Recorder</h1>
<div class="bar"><i id="pb"></i></div>
<div class="row"><small id="pt"></small></div></header>
<div class="tabs" id="tabs"></div>
<main id="main"></main>
<div class="foot"><button class="go" id="save">💾 Save ZIP of all recordings</button><button id="saveStory">Save this story only</button><button id="clear">Clear all</button></div>
<script>
const DATA=[{"id":"first-day","n":1,"title":"THE FIRST DAY","scenes":[{"n":1,"heading":"PORT LIFEX · EARLY MORNING","narration":"The city was already awake when Kael arrived. He had travelled far for this moment, carrying one suitcase and a thousand expectations.","lines":[{"id":"s1_l1","who":"Sister","t":12.2,"max":2.8,"text":"Call me the moment you get settled.","note":""},{"id":"s1_l2","who":"Kael","t":15,"max":1.6,"text":"I will. I promise.","note":""}]},{"n":2,"heading":"UNIVERSITY OF PORT LIFEX","narration":"At the University of Port LIFEX, students hurried to lectures. Kael stopped for a moment and looked at the buildings. This was where his next chapter would begin.","lines":[{"id":"s2_l1","who":"Student 1","t":1,"max":2.4,"text":"Are you ready for the test today?","note":""},{"id":"s2_l2","who":"Student 2","t":3.6,"max":2,"text":"Don't even talk about it!","note":""}]},{"n":3,"heading":"THE FIRST LECTURE","narration":"The lecture hall was louder than he expected. He found a seat, opened his notebook and wrote the date. A student beside him smiled. 'First day? You go dey alright.'","lines":[{"id":"s3_l1","who":"Lecturer","t":0.3,"max":3.8,"text":"Good morning, everyone. Please settle down quickly.","note":""},{"id":"s3_l2","who":"Lecturer","t":6.5,"max":3.5,"text":"Today we begin with the foundations.","note":""},{"id":"s3_l3","who":"Tobi","t":10.2,"max":2.6,"text":"First day? You go dey alright.","note":""},{"id":"s3_l4","who":"Kael","t":13,"max":1.6,"text":"I hope so.","note":""},{"id":"s3_l5","who":"Tobi","t":15,"max":2,"text":"Relax. I'm Tobi.","note":""}]},{"n":4,"heading":"A PROMISE TO HIMSELF","narration":"By evening, the campus felt less unfamiliar. Kael called home and made one promise: he would make this opportunity count.","lines":[{"id":"s4_l1","who":"Kael","t":1.5,"max":3.5,"text":"Mum, I'm fine. The campus is beautiful.","note":"(on the phone)"},{"id":"s4_l2","who":"Kael","t":5.5,"max":3,"text":"I won't waste this chance. I promise.","note":"(on the phone)"}]}]},{"id":"night-drive","n":2,"title":"THE NIGHT DRIVE","scenes":[{"n":1,"heading":"HOTEL PRESIDENTIAL · 9:40 PM","narration":"The meeting had gone longer than planned. Doran collected his keys at the hotel lobby and stepped into the warm Port LIFEX night.","lines":[{"id":"s1_l1","who":"Clerk","t":3,"max":2.6,"text":"Your keys, sir. Have a safe night.","note":""},{"id":"s1_l2","who":"Doran","t":6,"max":2,"text":"Thank you. Goodnight.","note":""},{"id":"s1_l3","who":"Doran","t":8.8,"max":1.4,"text":"Is it parked outside?","note":""},{"id":"s1_l4","who":"Clerk","t":10.4,"max":1.4,"text":"Yes, sir. Safe drive.","note":""}]},{"n":2,"heading":"THE EMPTY ROAD","narration":"The roads were unusually quiet. Then, just beyond a pool of streetlight, Doran noticed a figure waving frantically beside a stopped vehicle.","lines":[{"id":"s2_l1","who":"Efe","t":3.6,"max":8,"text":"Please! Please, stop! My car has broken down! Please, can anybody help me?","note":"(shouting from far away)"}]},{"n":3,"heading":"A CHOICE IN THE DARK","narration":"He slowed down and kept his distance. He called emergency services and shared the location. Courage, he realised, was not the same as recklessness.","lines":[{"id":"s3_l1","who":"Doran","t":7.5,"max":4.5,"text":"Hello, emergency? A woman needs help on the harbour road. Please send someone now.","note":"(on the phone)"}]},{"n":4,"heading":"SAFE ARRIVAL","narration":"When help arrived, Doran continued his journey. The city lights stretched ahead of him. Tonight, he had made the right choice.","lines":[]}]},{"id":"pleasure-park","n":3,"title":"A PLEASURE PARK PROMISE","scenes":[{"n":1,"heading":"THE PARK GATES","narration":"Saturday afternoon brought music, laughter and families to Pleasure Park. Amara arrived early, determined not to miss her friend this time.","lines":[{"id":"s1_l1","who":"Kael","t":6.4,"max":1.4,"text":"Amara! Over here!","note":"(calling out)"},{"id":"s1_l2","who":"Amara","t":12.2,"max":2.2,"text":"Kael! You finally came!","note":""},{"id":"s1_l3","who":"Kael","t":14.5,"max":2,"text":"I wouldn't miss it.","note":""}]},{"n":2,"heading":"UNDER THE FERRIS WHEEL","narration":"Kael appeared beneath the Ferris wheel, waving both hands. They laughed about the week, then hurried towards the rides like children on holiday.","lines":[{"id":"s2_l1","who":"Kael","t":1.5,"max":2.6,"text":"Look at that wheel. Let's go first!","note":""},{"id":"s2_l2","who":"Amara","t":4.4,"max":2.8,"text":"Only if you don't scream!","note":""},{"id":"s2_l3","who":"Kael","t":7.6,"max":2,"text":"No promises!","note":""}]},{"n":3,"heading":"FOOD VILLAGE","narration":"At the food village, they shared a meal and talked about their plans. Amara admitted she was afraid of what came next. Kael reminded her she did not have to face it alone.","lines":[{"id":"s3_l1","who":"Kael","t":5.4,"max":2.4,"text":"You've been quiet. What's wrong?","note":""},{"id":"s3_l2","who":"Amara","t":8.2,"max":3.4,"text":"I'm afraid of what comes after school.","note":""},{"id":"s3_l3","who":"Kael","t":12.6,"max":3.6,"text":"You don't have to face it alone. I'm here.","note":""}]},{"n":4,"heading":"THE PROMISE","narration":"When the park lights came on, they made a promise: no matter how busy life became, they would make time for the people who mattered.","lines":[{"id":"s4_l1","who":"Kael","t":5.4,"max":3.4,"text":"Whatever happens, let's always make time for each other.","note":""},{"id":"s4_l2","who":"Amara","t":9.2,"max":3,"text":"Promise. No matter how busy we get.","note":""}]}]},{"id":"presidential-suite","n":4,"title":"THE PRESIDENTIAL SUITE","scenes":[{"n":1,"heading":"THE GRAND ARRIVAL","narration":"Maya had built her design business from a tiny room and a second-hand laptop. Today, she was meeting a major client at Hotel Presidential.","lines":[{"id":"s1_l1","who":"Client","t":16.2,"max":1.6,"text":"Ms. Maya? Welcome.","note":""}]},{"n":2,"heading":"THE CONTRACT","narration":"The client studied every page. Maya kept her voice steady, explained the details and answered each question. Then the client closed the folder and smiled.","lines":[{"id":"s2_l1","who":"Maya","t":3,"max":3.6,"text":"As you can see, the proposal covers every stage.","note":""},{"id":"s2_l2","who":"Client","t":8,"max":2.2,"text":"And the timeline?","note":""},{"id":"s2_l3","who":"Maya","t":10.6,"max":3.6,"text":"Eight weeks, with a review every week.","note":""},{"id":"s2_l4","who":"Client","t":14.6,"max":1.6,"text":"We have a deal.","note":""}]},{"n":3,"heading":"THE CELEBRATION","narration":"The contract was signed. Maya stepped into the lounge and called her mother. The first person she wanted to tell was the person who had believed in her before anyone else.","lines":[{"id":"s3_l1","who":"Maya","t":3.4,"max":3.2,"text":"Mama, I got it! The contract is signed!","note":"(on the phone)"},{"id":"s3_l2","who":"Maya","t":7,"max":3.4,"text":"Thank you for believing in me first.","note":"(on the phone)"}]},{"n":4,"heading":"WHAT SUCCESS MEANS","narration":"As she left the hotel, Maya knew the contract was only a beginning. Success would mean more if she could open a door for someone else too.","lines":[]}]},{"id":"missing-briefcase","n":5,"title":"THE MISSING BRIEFCASE","scenes":[{"n":1,"heading":"THE EMPTY CHAIR","narration":"The presentation was less than an hour away. Chika reached for the briefcase, but the chair beside the desk was empty. The documents were gone.","lines":[{"id":"s1_l1","who":"Chika","t":10.4,"max":2.6,"text":"Tobi, where is the briefcase?","note":""},{"id":"s1_l2","who":"Tobi","t":13.2,"max":2.4,"text":"It was right here, I swear.","note":""},{"id":"s1_l3","who":"Chika","t":15.8,"max":1.6,"text":"The meeting is in an hour!","note":""}]},{"n":2,"heading":"FOLLOW THE CLUE","narration":"A guard remembered a visitor leaving through the side entrance. Chika checked the security log and found a vehicle description. It was the first real clue.","lines":[{"id":"s2_l1","who":"Chika","t":4.4,"max":2.4,"text":"Did you see anyone leave?","note":""},{"id":"s2_l2","who":"Guard","t":7.2,"max":3.6,"text":"A visitor went out the side entrance, in a grey car.","note":""},{"id":"s2_l3","who":"Chika","t":13.6,"max":1.4,"text":"Thank you.","note":""}]},{"n":3,"heading":"THE INTERCEPTION","narration":"Near the junction, Chika spotted the vehicle. She did not confront the driver alone. She alerted the security team and waited for them to arrive.","lines":[{"id":"s3_l1","who":"Chika","t":8.8,"max":3,"text":"Security, the car is at the junction. Please come.","note":"(on the radio / phone)"},{"id":"s3_l2","who":"Guard","t":16,"max":2,"text":"We're on our way.","note":""},{"id":"s3_l3","who":"Chika","t":18.2,"max":1.6,"text":"Thank you for coming.","note":""}]},{"n":4,"heading":"THE TRUTH","narration":"The briefcase was recovered. The visitor had moved it after mistaking it for an old file. The mystery ended with an apology, a lesson in communication and a presentation saved just in time.","lines":[{"id":"s4_l1","who":"Visitor","t":4.2,"max":3,"text":"I'm sorry. I thought it was an old file.","note":""},{"id":"s4_l2","who":"Chika","t":8.6,"max":3,"text":"Next time, please ask before moving anything.","note":""},{"id":"s4_l3","who":"Visitor","t":12,"max":2,"text":"I will. Truly sorry.","note":""}]}]}];
const lineKey=(s,sc,l)=>`${String(s.n).padStart(2,'0')}-${s.id}/scene${sc.n}_${l.id.split('_')[1]}_${(l.who||'x').toLowerCase().replace(/\s+/g,'')}`;
const NARR=(s,sc)=>({id:'narration',who:'Narrator',t:0,max:sc.narration.split(/\s+/).length/2.6,text:sc.narration,note:'(optional – calm storyteller voice)',key:`${String(s.n).padStart(2,'0')}-${s.id}/scene${sc.n}_narration_narrator`});
DATA.forEach(s=>s.scenes.forEach(sc=>{sc.lines.forEach(l=>l.key=lineKey(s,sc,l));sc.nar=NARR(s,sc);sc.nar.key=sc.nar.key;}));
// storage (IndexedDB, falls back to memory)
const mem={};let db=null;
const dbp=new Promise(r=>{try{const q=indexedDB.open('everyday-vo',1);q.onupgradeneeded=()=>q.result.createObjectStore('w');q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}});
const put=async(k,v)=>{mem[k]=v;await dbp;if(!db)return;try{db.transaction('w','readwrite').objectStore('w').put(v,k)}catch(e){}};
const del=async k=>{delete mem[k];await dbp;if(!db)return;try{db.transaction('w','readwrite').objectStore('w').delete(k)}catch(e){}};
const loadAll=async()=>{await dbp;if(!db)return;await new Promise(r=>{const c=db.transaction('w').objectStore('w').openCursor();c.onsuccess=()=>{const x=c.result;if(x){mem[x.key]=x.value;x.continue()}else r()};c.onerror=()=>r()})};
// audio → 16-bit mono WAV
async function toWav(blob){const ctx=new (window.AudioContext||window.webkitAudioContext)();const buf=await ctx.decodeAudioData(await blob.arrayBuffer());ctx.close();
 const n=buf.length,ch=buf.numberOfChannels,sr=buf.sampleRate;const m=new Float32Array(n);for(let c=0;c<ch;c++){const d=buf.getChannelData(c);for(let i=0;i<n;i++)m[i]+=d[i]/ch}
 // trim leading/trailing near-silence (keep 120 ms)
 let a=0,b=n-1;const th=0.01;while(a<n&&Math.abs(m[a])<th)a++;while(b>a&&Math.abs(m[b])<th)b--;const pad=Math.round(sr*.12);a=Math.max(0,a-pad);b=Math.min(n-1,b+pad);
 const len=b-a+1,o=new DataView(new ArrayBuffer(44+len*2));const w=(p,s)=>[...s].forEach((c,i)=>o.setUint8(p+i,c.charCodeAt(0)));
 w(0,'RIFF');o.setUint32(4,36+len*2,true);w(8,'WAVE');w(12,'fmt ');o.setUint32(16,16,true);o.setUint16(20,1,true);o.setUint16(22,1,true);o.setUint32(24,sr,true);o.setUint32(28,sr*2,true);o.setUint16(32,2,true);o.setUint16(34,16,true);w(36,'data');o.setUint32(40,len*2,true);
 for(let i=0;i<len;i++){const v=Math.max(-1,Math.min(1,m[a+i]));o.setInt16(44+i*2,v<0?v*0x8000:v*0x7fff,true)}
 return {blob:new Blob([o.buffer],{type:'audio/wav'}),dur:len/sr}}
// zip (store)
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=u=>{let c=~0;for(let i=0;i<u.length;i++)c=crcT[(c^u[i])&255]^(c>>>8);return(~c)>>>0};
async function zip(files){const enc=new TextEncoder(),parts=[],cd=[];let off=0;
 for(const f of files){const nm=enc.encode(f.name),d=new Uint8Array(await f.blob.arrayBuffer()),c=crc(d);
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);
  parts.push(h.buffer,nm,d);
  const e=new DataView(new ArrayBuffer(46));e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint16(8,0x0800,true);e.setUint32(16,c,true);e.setUint32(20,d.length,true);e.setUint32(24,d.length,true);e.setUint16(28,nm.length,true);e.setUint32(42,off,true);
  cd.push(e.buffer,nm);off+=30+nm.length+d.length}
 let cs=0;cd.forEach(x=>cs+=x.byteLength||x.length);const en=new DataView(new ArrayBuffer(22));en.setUint32(0,0x06054b50,true);en.setUint16(8,files.length,true);en.setUint16(10,files.length,true);en.setUint32(12,cs,true);en.setUint32(16,off,true);
 return new Blob([...parts,...cd,en.buffer],{type:'application/zip'})}
// UI
let cur=0,rec=null,playing=null;const $=id=>document.getElementById(id);
const all=()=>DATA.flatMap(s=>s.scenes.flatMap(sc=>[...sc.lines,sc.nar].map(l=>({s,sc,l}))));
const scripted=()=>DATA.flatMap(s=>s.scenes.flatMap(sc=>sc.lines));
function progress(){const L=scripted(),d=L.filter(l=>mem[l.key]).length;$('pb').style.width=(L.length?d/L.length*100:0)+'%';$('pt').textContent=`${d} of ${L.length} dialogue lines recorded (narration is optional)`}
function tabs(){$('tabs').innerHTML='';DATA.forEach((s,i)=>{const b=document.createElement('button');b.className='tab'+(i===cur?' on':'');b.textContent=`${s.n}. ${s.title}`;b.onclick=()=>{cur=i;tabs();render()};$('tabs').appendChild(b)})}
function render(){const s=DATA[cur],m=$('main');m.innerHTML='';
 s.scenes.forEach(sc=>{const h=document.createElement('h2');h.textContent=`Scene ${sc.n} · ${sc.heading}`;m.appendChild(h);
  if(!sc.lines.length){const p=document.createElement('small');p.textContent='No dialogue in this scene (music / narration only).';m.appendChild(p)}
  [...sc.lines,sc.nar].forEach(l=>m.appendChild(card(s,sc,l)))});progress()}
function card(s,sc,l){const el=document.createElement('div'),has=!!mem[l.key];el.className='line'+(has?' done':'');
 const nar=l.id==='narration';
 el.innerHTML=`<div><span class="who">${l.who}</span> <span class="meta">· ${nar?'whole scene (~'+Math.round(l.max)+'s)':'starts ~'+l.t+'s · fits '+l.max+'s'}</span></div>
 ${l.note?`<div class="note">${l.note}</div>`:''}<div class="txt" contenteditable="false">${l.text}</div>
 <div class="row"><button class="rec">● Record</button><button data-p ${has?'':'disabled'}>▶ Play</button><button data-d ${has?'':'disabled'}>✕ Delete</button><label class="meta">or <input type="file" accept="audio/*" style="max-width:150px"></label><span class="st">${has?stat(l):''}</span></div>
 <details><summary class="meta">Change the wording</summary><textarea rows="2">${l.text}</textarea></details>`;
 const [bR,bP,bD]=el.querySelectorAll('button'),st=el.querySelector('.st'),tx=el.querySelector('.txt');
 el.querySelector('textarea').oninput=e=>{l.text=e.target.value;tx.textContent=l.text};
 bR.onclick=async()=>{if(rec&&rec.l===l){rec.stop();return}if(rec)rec.stop();
  try{const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
   const mr=new MediaRecorder(stream),ch=[];mr.ondataavailable=e=>ch.push(e.data);
   mr.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());rec=null;bR.textContent='● Record';bR.classList.remove('rec');el.classList.remove('live');st.textContent='processing…';
    try{const r=await toWav(new Blob(ch,{type:mr.mimeType}));r.l=l.text;await put(l.key,{blob:r.blob,dur:r.dur,text:l.text,who:l.who,scene:sc.n,story:s.id});}catch(e){st.textContent='could not process audio: '+e.message;return}
    render()};
   mr.start();rec={l,stop:()=>mr.stop()};bR.textContent='■ Stop';bR.classList.add('rec');el.classList.add('live');st.textContent='recording… speak now'}
  catch(e){alert('Microphone blocked. Allow mic access for this page (use Chrome/Edge/Safari, open from https or localhost, or as a local file).')}};
 bP.onclick=()=>{if(playing)playing.pause();playing=new Audio(URL.createObjectURL(mem[l.key].blob));playing.play()};
 bD.onclick=async()=>{await del(l.key);render()};
 el.querySelector('input[type=file]').onchange=async e=>{const f=e.target.files[0];if(!f)return;st.textContent='processing…';try{const r=await toWav(f);await put(l.key,{blob:r.blob,dur:r.dur,text:l.text,who:l.who,scene:sc.n,story:s.id});render()}catch(x){st.textContent='bad audio file'}};
 return el}
function stat(l){const r=mem[l.key];const long=r.dur>l.max+0.6&&l.id!=='narration';return `<span class="${long?'long':'ok'}">${r.dur.toFixed(1)}s${long?' – a bit long, try speaking faster':' ✓'}</span>`}
async function build(only){const files=[],man=[];
 for(const s of DATA){if(only&&s!==only)continue;for(const sc of s.scenes)for(const l of [...sc.lines,sc.nar]){const r=mem[l.key];if(!r)continue;files.push({name:l.key+'.wav',blob:r.blob});man.push({file:l.key+'.wav',story:s.id,scene:sc.n,speaker:l.who,text:l.text,startsAtSec:l.id==='narration'?0:l.t,seconds:+r.dur.toFixed(2)})}}
 if(!files.length){alert('Nothing recorded yet.');return}
 files.push({name:'manifest.json',blob:new Blob([JSON.stringify(man,null,2)])});
 const z=await zip(files),a=document.createElement('a');a.href=URL.createObjectURL(z);a.download=only?`voiceovers-${only.id}.zip`:'everyday-voiceovers.zip';a.click()}
$('save').onclick=()=>build();$('saveStory').onclick=()=>build(DATA[cur]);
$('clear').onclick=async()=>{if(!confirm('Delete ALL recordings?'))return;for(const k of Object.keys(mem))await del(k);render()};
loadAll().then(()=>{tabs();render()});
</script></body></html>
