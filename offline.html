<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Offline — Everyday in PH</title>
<style>
  html, body {
    height: 100%; margin: 0;
    background: radial-gradient(circle at 50% 40%, #26303c, #0a0d11);
    color: #eaf6ff;
    font-family: Inter, system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px; box-sizing: border-box;
  }
  h1 {
    font-size: 48px;
    background: linear-gradient(90deg, #7dd3fc, #a78bfa, #f0abfc);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    margin: 0 0 8px;
  }
  p  { max-width: 320px; line-height: 1.6; opacity: 0.75; margin: 0 auto; }
  a  {
    display: inline-block; margin-top: 22px; padding: 14px 32px;
    border-radius: 40px;
    background: linear-gradient(135deg, #7dd3fc, #a5f3fc);
    color: #04121f; font-weight: 800; text-decoration: none; letter-spacing: 0.14em;
  }
</style>
</head>
<body>
<div>
  <h1>Offline</h1>
  <p>You're not connected yet. Load the game once while online and it will work offline from then on.</p>
  <a href="./index.html">Try again</a>

</html>
