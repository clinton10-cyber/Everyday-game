name: Build APK and publish release

# Automatic: every push to main/master builds the APK and publishes it as a
# GitHub Release (tag "build-<run number>").
# Official versions: git tag v1.0.0 && git push origin v1.0.0
# Manual: Actions tab -> "Build APK and publish release" -> Run workflow
# (a manual run uploads the APK as a downloadable build artifact only).
on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APP_NAME: Everyday in PH
      APP_ID: com.clintontech.everydayph
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Copy the website into www/
        run: |
          mkdir www
          rsync -a --exclude '.git' --exclude '.github' --exclude 'www' \
                --exclude 'tools' --exclude 'branding' --exclude 'android' --exclude 'node_modules' \
                --exclude 'assets/audio/voice/SCRIPT.md' ./ www/

      - name: Install Capacitor and create the Android project
        run: |
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "$APP_NAME" "$APP_ID" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Apply custom app icon
        run: |
          pip install pillow
          python3 - <<'EOF'
          from PIL import Image
          import os, shutil
          res = "android/app/src/main/res"
          src = Image.open("assets/icon-maskable-512.png").convert("RGBA")
          sizes = {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          fg = {"mdpi":108,"hdpi":162,"xhdpi":216,"xxhdpi":324,"xxxhdpi":432}
          for d,s in sizes.items():
              p = f"{res}/mipmap-{d}"
              os.makedirs(p, exist_ok=True)
              ic = src.resize((s,s), Image.LANCZOS)
              ic.save(f"{p}/ic_launcher.png")
              ic.save(f"{p}/ic_launcher_round.png")
              f = fg[d]; inner = int(f*0.66)
              canvas = Image.new("RGBA",(f,f),(0,0,0,0))
              canvas.paste(src.resize((inner,inner), Image.LANCZOS), ((f-inner)//2,(f-inner)//2))
              canvas.save(f"{p}/ic_launcher_foreground.png")
          open(f"{res}/values/ic_launcher_background.xml","w").write(
            '<?xml version="1.0" encoding="utf-8"?><resources>'
            '<color name="ic_launcher_background">#0b110e</color></resources>')
          shutil.rmtree(f"{res}/mipmap-anydpi-v26", ignore_errors=True)
          EOF

      - name: Apply Clinton Tech splash screen
        run: |
          pip install pillow
          python3 - <<'EOF'
          from PIL import Image
          import glob
          src = Image.open("branding/clinton-tech-splash.png").convert("RGB")
          files = glob.glob("android/app/src/main/res/drawable*/splash.png")
          for f in files:
              w, h = Image.open(f).size
              side = max(w, h)
              # centre-crop the square art to the file's aspect ratio
              crop_w = min(2732, int(2732 * w / side)); crop_h = min(2732, int(2732 * h / side))
              l = (2732 - crop_w) // 2; t = (2732 - crop_h) // 2
              src.crop((l, t, l + crop_w, t + crop_h)).resize((w, h), Image.LANCZOS).save(f)
          print("splash replaced in", len(files), "files")
          EOF

      - name: Lock app to landscape
        run: |
          F=android/app/src/main/AndroidManifest.xml
          grep -q 'android:screenOrientation' "$F" || sed -i '0,/<activity/s//<activity android:screenOrientation="sensorLandscape"/' "$F"
          grep -n 'screenOrientation' "$F"

      - name: Full screen (hide status and navigation bars, draw into notch)
        run: |
          python3 - <<'EOF'
          import glob, re
          # 1) theme: no status bar from the first frame
          st = "android/app/src/main/res/values/styles.xml"
          s = open(st).read()
          if "windowFullscreen" not in s:
              s = re.sub(r'(<style name="AppTheme\.NoActionBar"[^>]*>)',
                         r'\1\n        <item name="android:windowFullscreen">true</item>', s, count=1)
              open(st, "w").write(s)
          # 2) activity: sticky immersive + use the notch / camera cut-out area
          f = glob.glob("android/app/src/main/java/**/MainActivity.java", recursive=True)[0]
          pkg = re.search(r'^package\s+([\w.]+);', open(f).read(), re.M).group(1)
          open(f, "w").write("""package %s;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              goImmersive();
              try { getBridge().getWebView().addJavascriptInterface(new PHNative(), "PHNative"); } catch (Exception e) {}
            }
            /* JS: PHNative.savePhoto(base64, name, mime) -> saves into Pictures/Everyday in PH */
            public class PHNative {
              @android.webkit.JavascriptInterface
              public boolean savePhoto(String b64, String name, String mime) {
                try {
                  byte[] data = android.util.Base64.decode(b64, android.util.Base64.DEFAULT);
                  if (Build.VERSION.SDK_INT >= 29) {
                    android.content.ContentResolver r = getContentResolver();
                    android.content.ContentValues v = new android.content.ContentValues();
                    v.put(android.provider.MediaStore.Images.Media.DISPLAY_NAME, name);
                    v.put(android.provider.MediaStore.Images.Media.MIME_TYPE, mime);
                    v.put(android.provider.MediaStore.Images.Media.RELATIVE_PATH, "Pictures/Everyday in PH");
                    v.put(android.provider.MediaStore.Images.Media.IS_PENDING, 1);
                    android.net.Uri u = r.insert(android.provider.MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v);
                    if (u == null) return false;
                    java.io.OutputStream o = r.openOutputStream(u);
                    o.write(data); o.close();
                    v.clear(); v.put(android.provider.MediaStore.Images.Media.IS_PENDING, 0);
                    r.update(u, v, null, null);
                    return true;
                  }
                  if (checkSelfPermission(android.Manifest.permission.WRITE_EXTERNAL_STORAGE) != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                    requestPermissions(new String[]{android.Manifest.permission.WRITE_EXTERNAL_STORAGE}, 77);
                    return false;
                  }
                  java.io.File dir = new java.io.File(android.os.Environment.getExternalStoragePublicDirectory(android.os.Environment.DIRECTORY_PICTURES), "Everyday in PH");
                  dir.mkdirs();
                  java.io.File f = new java.io.File(dir, name);
                  java.io.FileOutputStream o = new java.io.FileOutputStream(f);
                  o.write(data); o.close();
                  android.media.MediaScannerConnection.scanFile(MainActivity.this, new String[]{f.getAbsolutePath()}, new String[]{mime}, null);
                  return true;
                } catch (Exception e) { return false; }
              }
            }
            @Override public void onResume() { super.onResume(); goImmersive(); }
            @Override public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) goImmersive();
            }
            private void goImmersive() {
              if (Build.VERSION.SDK_INT >= 28) {
                WindowManager.LayoutParams lp = getWindow().getAttributes();
                lp.layoutInDisplayCutoutMode = Build.VERSION.SDK_INT >= 30
                  ? WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                  : WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                getWindow().setAttributes(lp);
              }
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
              c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
              c.hide(WindowInsetsCompat.Type.systemBars());
            }
          }
          """ % pkg)
          mf = "android/app/src/main/AndroidManifest.xml"
          m = open(mf).read()
          if "WRITE_EXTERNAL_STORAGE" not in m:
              m = m.replace("<application", '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <application', 1)
              open(mf, "w").write(m)
          print("immersive MainActivity written for", pkg)
          EOF

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="0.0.${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"1.0\"/versionName \"${VERSION}\"/" android/app/build.gradle

      - name: Build debug APK (always installable)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build signed release APK (only if signing secrets exist)
        if: ${{ env.KEYSTORE_B64 != '' }}
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Collect APKs
        run: |
          mkdir out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/Everyday-in-PH-${VERSION}-debug.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "out/Everyday-in-PH-${VERSION}.apk"
          fi
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - name: Publish GitHub Release (version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true

      - name: Publish GitHub Release (automatic build from branch push)
        if: github.ref_type == 'branch' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: out/*.apk
          generate_release_notes: true
          make_latest: true
