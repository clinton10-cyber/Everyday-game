<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Everyday">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#0B1B3A"/>
      <stop offset="42%" stop-color="#1A3A6E"/>
      <stop offset="72%" stop-color="#3D7AB8"/>
      <stop offset="100%" stop-color="#F0A55A"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#7CF0FF" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#5EEAD4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="35%" stop-color="#A78BFA"/>
      <stop offset="70%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCEBFF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12"/>
    </filter>
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- Deep twilight city sky -->
    <rect width="512" height="512" fill="url(#sky)"/>

    <!-- Soft aurora wash -->
    <ellipse cx="150" cy="120" rx="180" ry="110" fill="#5EEAD4" opacity="0.18" filter="url(#soft2)"/>
    <ellipse cx="380" cy="160" rx="160" ry="100" fill="#A78BFA" opacity="0.16" filter="url(#soft2)"/>
    <ellipse cx="256" cy="300" rx="220" ry="140" fill="#FBBF24" opacity="0.12" filter="url(#soft2)"/>

    <!-- Flowing life ribbon (road / river of everyday) -->
    <path d="M -40 360
             C 60 300, 120 420, 220 360
             S 360 280, 420 340
             S 540 400, 560 340"
          fill="none" stroke="url(#ribbon)" stroke-width="28" stroke-linecap="round" opacity="0.95"/>
    <path d="M -40 360
             C 60 300, 120 420, 220 360
             S 360 280, 420 340
             S 540 400, 560 340"
          fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.35"/>

    <!-- Second thinner flow line -->
    <path d="M -20 400
             C 80 360, 150 450, 250 400
             S 390 330, 450 380
             S 540 430, 560 390"
          fill="none" stroke="url(#glow)" stroke-width="10" stroke-linecap="round" opacity="0.55"/>

    <!-- Rising sun disc -->
    <circle cx="256" cy="198" r="72" fill="#FFF7E6" opacity="0.95"/>
    <circle cx="256" cy="198" r="88" fill="#FBBF24" opacity="0.22" filter="url(#soft)"/>
    <circle cx="256" cy="198" r="54" fill="url(#glow)" opacity="0.35"/>

    <!-- Elegant E monogram mark above wordmark -->
    <g transform="translate(256 198)">
      <path d="M -34 -28
               C -10 -40, 18 -38, 30 -22
               C 38 -10, 34 6, 18 14
               L -8 14
               M -34 0 L 22 0
               M -34 28
               C -8 40, 20 38, 32 22"
            fill="none" stroke="#0B1B3A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.88"/>
      <path d="M -34 -28
               C -10 -40, 18 -38, 30 -22
               C 38 -10, 34 6, 18 14
               L -8 14
               M -34 0 L 22 0
               M -34 28
               C -8 40, 20 38, 32 22"
            fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- EVERYDAY wordmark -->
    <text x="256" y="458"
          font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif"
          font-size="54" font-weight="800" fill="url(#word)"
          text-anchor="middle" letter-spacing="10">EVERYDAY</text>

    <!-- Soft underline flow under word -->
    <path d="M 120 478 C 180 468, 230 488, 256 478 S 330 468, 392 478"
          fill="none" stroke="url(#ribbon)" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Outer soft rim -->
  <rect x="3" y="3" width="506" height="506" rx="110" ry="110"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="6"/>
</svg>
