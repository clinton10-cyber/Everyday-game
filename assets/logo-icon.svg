<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Everyday">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#0B1B3A"/>
      <stop offset="45%" stop-color="#1A3A6E"/>
      <stop offset="75%" stop-color="#3D7AB8"/>
      <stop offset="100%" stop-color="#F0A55A"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="40%" stop-color="#A78BFA"/>
      <stop offset="75%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#7CF0FF"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10"/>
    </filter>
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <ellipse cx="160" cy="130" rx="170" ry="110" fill="#5EEAD4" opacity="0.2" filter="url(#soft)"/>
    <ellipse cx="380" cy="180" rx="150" ry="100" fill="#A78BFA" opacity="0.18" filter="url(#soft)"/>

    <!-- Flowing ribbon -->
    <path d="M -30 370 C 70 300, 140 430, 250 360 S 390 280, 450 350 S 560 410, 560 350"
          fill="none" stroke="url(#ribbon)" stroke-width="34" stroke-linecap="round"/>
    <path d="M -30 370 C 70 300, 140 430, 250 360 S 390 280, 450 350 S 560 410, 560 350"
          fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.3"/>

    <!-- Sun -->
    <circle cx="256" cy="210" r="78" fill="#FFF7E6"/>
    <circle cx="256" cy="210" r="96" fill="#FBBF24" opacity="0.25" filter="url(#soft)"/>

    <!-- Flowing E monogram -->
    <g transform="translate(256 210)">
      <path d="M -42 -36
               C -8 -52, 28 -48, 40 -26
               C 50 -10, 44 12, 20 20
               L -12 20
               M -42 0 L 28 0
               M -42 36
               C -6 52, 30 48, 42 24"
            fill="none" stroke="#0B1B3A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M -42 -36
               C -8 -52, 28 -48, 40 -26
               C 50 -10, 44 12, 20 20
               L -12 20
               M -42 0 L 28 0
               M -42 36
               C -6 52, 30 48, 42 24"
            fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Small EVERYDAY arc label -->
    <text x="256" y="455"
          font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif"
          font-size="42" font-weight="800" fill="#FFFFFF"
          text-anchor="middle" letter-spacing="8">EVERYDAY</text>
  </g>
  <rect x="3" y="3" width="506" height="506" rx="110" ry="110"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="6"/>
</svg>
